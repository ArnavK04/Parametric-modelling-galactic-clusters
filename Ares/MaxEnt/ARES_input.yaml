observation:
  modeler: LensFactory
  lens: Ares_MaxEnt_OG
  z_d: 0.5
  reference: [0.0, 0.0]
  pixel_scale: 0.5
  FOV: [240, 240]


cosmology:
  H0: 72.0
  Omega_m0: 0.24
  Omega_r0: 0.00
  Omega_w0: 0.76


source:
  from_file: true
  source_file: /home/arnav/Parametric/Parametric-modelling-galactic-clusters/Ares/Parametric/ARES_images.txt


lens_model:
  method: MaxEnt
  multiplane: false
  total_lenses: 1
  alpha: 1.0
  lens1:
    lens: MultiPixelLens
    FOV: [240, 240]
    pixel_scale: 0.5
    default_map:
      type: uniform
      value: 0.5
      #file: /home/arnav/Parametric/Ares_outputs/Ares_Parametric_20261116/AresParametric_maps.jld2
    

sampling:
  scheme: SourcePlane
  verbose: true
  optimizer:
    enabled: true
    MaxEnt:
      n_runs: 200
      save_runs: false
      save_path: /home/arnav/Parametric/Ares_outputs/MaxEnt
      smoothing: 1.0
      tolerance: 1E-3
    LBFGS:
      iterations: 100000
      tolerance: 1e-6